<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="http://xxxxxxx/rem.js"></script>
</head>

<body>
  <script async src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <div id="app">{{ obj.a }}</div>

  <script>
    const { createApp, reactive, toRef } = Vue

    createApp({
      setup() {
        const obj = reactive({
          a: 1,
          b: 2
        })
        // const {a, b} = obj
        const a = toRef(obj, 'a')
        obj.a = 3
        console.log(a.value);

        return {
          obj
        }
      }
    }).mount('#app')
  </script>
</body>

</html>

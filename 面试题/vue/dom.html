<body>

  <div id="app">
    <p class="p">文本内容</p>
    <h3>{{count}}</h3>
  </div>

  <script>
    const { createApp, ref } = Vue

    createApp({
      setup() {
        const count = ref(1)
        return {
          count
        }
      }
    }).mount('#app')
  </script>
</body>
